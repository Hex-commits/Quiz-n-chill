name: quiz-quiz

# The database is NOT defined here. `supabase start` runs its own Docker stack
# (Postgres, PostgREST, Auth, Storage, Studio) on a separate network, and this
# compose file talks to it over the host. Bring it up first:
#
#   npm run db:start        # -> API 54321, DB 54322, Studio 54323
#   docker compose up
#
# Keeping them separate means local Supabase behaves exactly like hosted
# Supabase, instead of being an approximation we have to maintain.

services:
  api:
    build:
      context: ./api
      target: development
    container_name: quiz_api
    restart: unless-stopped
    ports:
      # Host port is configurable because 8000 is a popular squatting spot.
      # Container port stays 8000 so the compose network address is stable.
      - "${API_PORT:-8001}:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      # Bind mount so uvicorn --reload picks up edits without a rebuild.
      - ./api:/app
    extra_hosts:
      # Lets the container reach the Supabase stack running on the host.
      # Docker Desktop provides this already; the mapping is here for Linux.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./web
      target: development
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    container_name: quiz_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Server components run inside this container and use the compose network.
      API_URL: http://api:8000
      # The browser runs on the host, so it needs the published port.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      # Hot reload across the bind mount needs polling. Turbopack is configured
      # for it in web/next.config.ts (watchOptions.pollIntervalMs) -- the
      # WATCHPACK_* / CHOKIDAR_* env vars only apply to webpack and do nothing
      # for Next 16, which uses Turbopack by default.
    volumes:
      - ./web:/app
      # Anonymous volumes keep container-built artefacts from being shadowed by
      # the host mount (and stop node_modules leaking onto the host).
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
